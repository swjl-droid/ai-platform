name: Gateway release

# When a new gateway version reaches main, list the apps (gateway.apps.json) that need the
# stamped copy, in one issue of this repo. GitHub's built-in token may write issues here but
# cannot open pull requests in prj01 / prj02; the copy pull requests are opened with
#   node scripts/gateway/open-copy-prs.mjs <work-dir>
# by a session that can push to the app repos (no new secret, decision 25/11/2026).

on:
  push:
    branches: [main]
    paths: ["gateway/**", "gateway.apps.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Open or update the copy reminder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat gateway/VERSION)"
          apps="$(node -e 'for (const a of require("./gateway.apps.json").apps) console.log(`- [ ] ${a.repo} (${a.path})`)')"
          title="Copy gateway ${version} into the apps"
          body="$(printf 'Gateway **%s** is on main (commit %s).\n\nOpen one copy pull request per app:\n\n```\nnode scripts/gateway/open-copy-prs.mjs ../gateway-copies\n```\n\n%s\n\nClose this issue when every copy pull request is merged.' "$version" "${GITHUB_SHA::7}" "$apps")"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq "map(select(.title == \"$title\" and (.pull_request | not)))[0].number // empty")"
          if [ -n "$existing" ]; then gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -f body="$body" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" >/dev/null; fi
