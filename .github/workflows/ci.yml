name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Same major version as the hosted ai-platform database.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rehearsal
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and check the rules
        run: bash scripts/ci/check_migrations.sh supabase/migrations
