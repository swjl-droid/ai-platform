name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Same major version as the hosted ai-platform database.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rehearsal
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and check the rules
        run: bash scripts/ci/check_migrations.sh supabase/migrations

  gateway:
    name: Gateway tests and stamp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Unit tests (cost, masking, trace content, certificate check)
        run: npm test
      - name: A gateway change must bump gateway/VERSION
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- gateway/)"
          if [ -n "$changed" ] && ! grep -qx 'gateway/VERSION' <<<"$changed"; then
            echo "gateway/ changed but gateway/VERSION did not:"; echo "$changed"
            echo "Bump the version, so each stamped copy in the apps names one exact content."; exit 1
          fi
          echo "ok"
      - name: Copy into a scratch app and check the stamp (also proves a hand edit is caught)
        run: |
          app="$(mktemp -d)"; echo '{"name":"scratch","private":true,"type":"module"}' > "$app/package.json"
          node scripts/gateway/sync.mjs prj01 "$app"
          node "$app/lib/gateway/stamp.mjs" verify "$app/lib/gateway"
          echo '// hand edit' >> "$app/lib/gateway/index.js"
          if node "$app/lib/gateway/stamp.mjs" verify "$app/lib/gateway"; then
            echo "FAIL: a hand-edited copy passed the stamp check"; exit 1
          fi
          echo "hand edit caught"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: bash scripts/ci/secret_scan.sh .
